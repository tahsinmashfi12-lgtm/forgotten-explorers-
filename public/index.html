<style>
/* Layout concept: a documentary in reels — full-bleed photographic plates alternate with narrow editorial columns; data lives in mono "mission tags". */
:root{
  color-scheme:dark;
  --void:#050810; --navy:#0B1424; --deep:#14243A; --star:#EAF0F7; --silver:#9AA9BA; --blue:#5599D5; --rust:#C66B42; --green:#65B98A;
  --line:rgba(154,169,186,.18); --line-2:rgba(154,169,186,.32); --panel:rgba(11,20,36,.78); --amber:#D9A35B; --red:#D2665A;
  --accent:var(--blue);
  /* typography tokens — one primary family (Montserrat) for all text and UI, DM Mono only for technical data.
     Anek Bangla and IBM Plex Sans Arabic supply the Bengali and Arabic scripts Montserrat does not cover. */
  --font-primary:"Montserrat","Anek Bangla","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-technical:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,"Anek Bangla","IBM Plex Sans Arabic",monospace;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extrabold:800;
  --f-display:var(--font-primary); --f-body:var(--font-primary); --f-mono:var(--font-technical);
  --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  --wrap:1240px; --nav-h:64px;
}
html[lang=bn]{--font-primary:"Montserrat","Anek Bangla",system-ui,sans-serif}
html[lang=ar]{--font-primary:"IBM Plex Sans Arabic","Montserrat",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{margin:0;background:var(--void);color:var(--star);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
html[lang=ar] .mono,html[lang=bn] .mono{letter-spacing:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.08}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=bn] h1,html[lang=bn] h2,html[lang=bn] h3{letter-spacing:0;line-height:1.35}
h1{font-size:clamp(2.4rem,6.4vw,5.6rem)} h2{font-size:clamp(1.8rem,3.6vw,3rem)} h3{font-size:1.15rem;letter-spacing:-.01em}
p{margin:0} .lede{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--silver);max-width:62ch}
.eyebrow{color:var(--blue);display:inline-flex;gap:.6em;align-items:center}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.section{padding-block:clamp(64px,10vw,128px)}
.btn{display:inline-flex;align-items:center;gap:.6em;padding:.85em 1.4em;border:1px solid var(--line-2);background:transparent;cursor:pointer;text-decoration:none;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;transition:background .25s,border-color .25s,color .25s;border-radius:2px}
html[lang=ar] .btn,html[lang=bn] .btn{letter-spacing:0;font-family:var(--f-display);font-size:.9rem}
.btn:hover{border-color:var(--star);background:rgba(234,240,247,.06)}
.btn.primary{background:var(--star);color:var(--void);border-color:var(--star)}
.btn.primary:hover{background:#fff}
.btn.small{padding:.55em .9em;font-size:.7rem}
.arrow{transition:transform .25s} .btn:hover .arrow{transform:translateX(4px)} html[dir=rtl] .arrow{transform:scaleX(-1)}

/* NAV */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;transition:background-color .35s,border-color .35s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(5,8,16,.95);border-bottom-color:var(--line)}
@media (hover:hover) and (pointer:fine) and (min-width:901px){.nav.solid{background:rgba(5,8,16,.96)}}
.nav .wrap{display:flex;align-items:center;gap:20px;width:100%;max-width:1440px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1;gap:4px;flex-shrink:0}
.brand b{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;font-size:.92rem}
.brand span{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.2em;color:var(--silver)}
.navlinks{display:flex;gap:2px;margin-inline-start:auto;list-style:none;padding:0;margin-block:0}
.navlinks a{display:block;white-space:nowrap;padding:8px 10px;text-decoration:none;font-size:.86rem;color:var(--silver);border-radius:2px;transition:color .2s}
.navlinks a:hover,.navlinks a[aria-current=page]{color:var(--star)}
.navlinks a[aria-current=page]{box-shadow:inset 0 -1px 0 var(--blue)}
.navtools{display:flex;gap:6px;align-items:center}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:1px solid transparent;cursor:pointer;border-radius:2px;color:var(--star)}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn svg{width:18px;height:18px}
.novabtn{--v:#8B7BE8;position:relative;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 11px;margin-inline:2px 4px;border-radius:999px;text-decoration:none;white-space:nowrap;
  font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.16em;color:var(--star);
  background:linear-gradient(135deg,rgba(85,153,213,.16),rgba(139,123,232,.2)) padding-box,linear-gradient(#070b16,#070b16) padding-box,linear-gradient(135deg,rgba(120,180,240,.8),rgba(150,130,245,.8)) border-box;border:1px solid transparent;
  box-shadow:0 0 16px -2px rgba(118,120,240,.38),inset 0 0 12px rgba(120,150,255,.08);transition:box-shadow .3s,transform .3s,background .3s}
.novabtn svg{width:14px;height:14px;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(160,150,255,.7))}
.novabtn b{font-weight:500}.novabtn .ai{color:#B7C6F7}
.novabtn:hover,.novabtn:focus-visible{box-shadow:0 0 24px 0 rgba(118,120,240,.6),inset 0 0 14px rgba(120,150,255,.14);transform:translateY(-1px)}
.novabtn[aria-current=page]{background:linear-gradient(135deg,rgba(85,153,213,.3),rgba(139,123,232,.34)) padding-box,linear-gradient(#070b16,#070b16) padding-box,linear-gradient(135deg,#8CC4F2,#A897FF) border-box}
.novabtn{overflow:hidden}
.novabtn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;pointer-events:none;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.18) 50%,transparent 100%);transform:translateX(-120%);animation:novaSheen 6s ease-in-out 1.5s infinite;will-change:transform}
@keyframes novaSheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
/* NOVA AI button: homepage hero palette (warm off-white + Mars red), no purple glow */
.novabtn{color:#F2EDE4;background:rgba(194,80,46,.1);border:1px solid rgba(194,80,46,.6);box-shadow:none}
.novabtn svg{filter:none}.novabtn svg path{fill:#D9663F}
.novabtn .ai{color:#E3A48A}
.novabtn:hover,.novabtn:focus-visible{background:rgba(194,80,46,.2);border-color:#C2502E;box-shadow:0 0 18px -4px rgba(194,80,46,.55)}
.novabtn[aria-current=page]{background:rgba(194,80,46,.26);border-color:#D9663F}
.novabtn::after{background:linear-gradient(110deg,transparent 0%,rgba(242,237,228,.1) 50%,transparent 100%)}
html[lang=ar] .novabtn,html[lang=bn] .novabtn{letter-spacing:.06em}
.langsel{background:transparent;border:1px solid var(--line);padding:7px 8px;border-radius:2px;font-size:.8rem;max-width:110px}
.langsel option{background:var(--navy)}
.burger{display:none}
@media (max-width:359px){.nav .novabtn b{display:none}.nav .novabtn{width:34px;padding:0;justify-content:center}}
@media (min-width:1321px){.navlinks a{padding:8px 5px;font-size:.77rem;letter-spacing:-.01em}}
@media (max-width:1320px){.navlinks{display:none}.burger{display:grid}.navtools{margin-inline-start:auto}}
@media (max-width:600px){.nav .wrap{gap:10px}.nav .brand{flex-shrink:1;min-width:0}.nav .brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media (max-width:420px){.nav .brand b{font-size:.7rem!important;letter-spacing:.04em!important}}.nav .langsel{display:none}.brand span{display:none}.nav .brand b{font-size:.78rem;letter-spacing:.12em}.navtools{gap:4px}.novabtn{height:32px;padding:0 10px 0 9px;gap:6px;margin-inline:0}.novabtn .ai{display:none}.hero::after{background:linear-gradient(0deg,var(--void) 0%,rgba(5,8,16,.78) 45%,rgba(5,8,16,.55) 100%)!important}.facts{grid-template-columns:1fr 1fr}.facts div+div{border-inline-start:0;padding-inline-start:0}.facts div{border-bottom:1px solid var(--line)}.coord{gap:18px}}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(5,8,16,.97);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut-r) 24px var(--gut);overflow:auto}
.drawer nav a{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:600;padding:10px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}

/* SEARCH */
.searchbox{position:fixed;inset:0;z-index:80;background:rgba(5,8,16,.94);backdrop-filter:blur(6px);padding:calc(env(safe-area-inset-top,0px) + 72px) var(--gut-r) 24px var(--gut);overflow:auto}
.searchbox .inner{max-width:760px;margin:0 auto}
.searchbox input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);font-family:var(--f-display);font-size:clamp(1.3rem,3vw,2rem);padding:12px 0;outline:none}
.searchbox input:focus{border-color:var(--blue)}
.sres{list-style:none;padding:0;margin:20px 0 0}
.sres a{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.sres img,.sres .ph{width:72px;height:54px;object-fit:cover;background:var(--navy)}
.sres small{color:var(--silver)}
.searchbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);inset-inline-end:var(--gut-r)}

/* HERO */
.hero{position:relative;min-height:min(100svh,940px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2;background:#000}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:72% 50%;animation:drift 40s ease-in-out infinite alternate;transform-origin:70% 50%}
.hero .bg.lrv{background:radial-gradient(ellipse at 70% 40%,#1a1c20 0%,#07080b 60%,#000 100%)}
.hero .bg.lrv picture{position:absolute;inset:0;width:100%;display:block}
.hero .bg.lrv img{object-position:44% 40%}
@media (min-width:1101px){.hero .bg.lrv picture{inset:0 0 0 auto;width:68%}.hero .bg.lrv img{object-position:6% 45%;transform-origin:40% 50%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%);mask-image:linear-gradient(90deg,transparent 0,#000 16%)}
 html[dir=rtl] .hero .bg.lrv picture{inset:0 auto 0 0}html[dir=rtl] .hero .bg.lrv img{-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 16%);mask-image:linear-gradient(270deg,transparent 0,#000 16%)}}
@media (max-width:760px){.hero .bg.lrv img{object-position:36% 30%}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12) translateX(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,8,16,.7) 0,transparent 140px),linear-gradient(90deg,rgba(5,8,16,.92) 0%,rgba(5,8,16,.6) 42%,rgba(5,8,16,.1) 75%),linear-gradient(0deg,var(--void) 0%,transparent 35%)}
html[dir=rtl] .hero::after{background:linear-gradient(180deg,rgba(5,8,16,.7) 0,transparent 140px),linear-gradient(270deg,rgba(5,8,16,.92) 0%,rgba(5,8,16,.6) 42%,rgba(5,8,16,.1) 75%),linear-gradient(0deg,var(--void) 0%,transparent 35%)}
.hero .wrap{padding-block:calc(var(--nav-h) + 80px) clamp(48px,9vw,110px);width:100%}
.hero h1{font-weight:800;letter-spacing:.02em;font-size:clamp(2.6rem,7.6vw,6.6rem);line-height:.95;max-width:11ch}
html[lang=ar] .hero h1,html[lang=bn] .hero h1{letter-spacing:0}
.hero .sub{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--silver);margin:22px 0 10px}
.hero .tag{font-family:var(--f-display);font-size:clamp(1.1rem,2vw,1.5rem);font-weight:500;max-width:30ch;margin-bottom:12px}
.hero .lede{margin-bottom:32px;max-width:46ch}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.credit{position:absolute;bottom:12px;inset-inline-end:var(--gut-r);font-family:var(--f-mono);font-size:.62rem;color:rgba(234,240,247,.55);text-decoration:none;letter-spacing:.06em;max-width:60%;text-align:end}
.credit:hover{color:var(--star)}
.coord{display:flex;gap:28px;margin-top:44px;color:var(--silver);flex-wrap:wrap}
.coord div{display:flex;flex-direction:column-reverse;gap:4px}
.coord b{font-family:var(--f-display);color:var(--star);font-size:1.6rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* page header */
.pagehead{position:relative;padding-block:calc(var(--nav-h) + 72px) 56px;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line)}
.pagehead .bg{position:absolute;inset:0;z-index:-2}
.pagehead .bg img{width:100%;height:100%;object-fit:cover;opacity:.55}
.pagehead::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--void) 0%,rgba(5,8,16,.55) 60%,rgba(5,8,16,.75) 100%)}
.pagehead h1{font-size:clamp(2rem,5.2vw,4.4rem);max-width:20ch;margin:14px 0 18px}
.pagehead .credit{bottom:8px}

/* editorial split */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,6vw,88px);align-items:center}
.split > *{min-width:0}
.split .copy{display:flex;flex-direction:column;gap:22px}
.split .copy p{color:#C9D3DF;max-width:60ch}
.plate{position:relative;margin:0}
.plate img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--navy)}
.plate figcaption{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;color:var(--silver);margin-top:10px;display:flex;justify-content:space-between;gap:12px}
.plate figcaption a{color:var(--silver)} .plate figcaption a:hover{color:var(--star)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px} .duo .plate:nth-child(2){margin-top:64px}
@media (max-width:820px){.split{grid-template-columns:1fr}.duo .plate:nth-child(2){margin-top:28px}}

/* section head */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.shead > div{display:flex;flex-direction:column;gap:14px;max-width:760px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;text-decoration:none;gap:12px;min-width:0}
.card .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.05)}
.card .ph .pill{position:absolute;top:10px;inset-inline-start:10px}
.card h3{font-size:1.18rem}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--silver);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
html[lang=ar] .card .meta,html[lang=bn] .card .meta{letter-spacing:0}
.card p{color:#B9C4D1;font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .more{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.noimg{display:grid;place-items:center;height:100%;padding:18px;text-align:center;color:var(--silver);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;background:repeating-linear-gradient(135deg,var(--navy) 0 10px,#0d182b 10px 20px)}
.noimg b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--star);letter-spacing:-.01em;text-transform:none;margin-bottom:8px}
.featured-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,360px);gap:22px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.featured-rail .card{scroll-snap-align:start}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;background:rgba(5,8,16,.82);border:1px solid var(--line-2);font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;white-space:nowrap}
html[lang=ar] .pill,html[lang=bn] .pill{letter-spacing:0;font-size:.72rem}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--silver);flex-shrink:0}
.pill.active i{background:var(--green);box-shadow:0 0 0 3px rgba(101,185,138,.18);position:relative}
.pill.active i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(101,185,138,.55);animation:pulse 2.4s ease-out 4}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%,100%{transform:scale(1.9);opacity:0}}
.pill.completed i{background:var(--blue)} .pill.retired i{background:var(--silver)} .pill.inactive i{background:transparent;border:1px solid var(--silver)}
.pill.contact-lost i{background:var(--amber)} .pill.lost i{background:var(--red)} .pill.unknown i{background:transparent;border:1px dashed var(--silver)}

/* timeline preview strip */
.tlstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);margin-top:8px}
.tlstrip a{padding:22px 18px 22px 0;border-inline-end:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;gap:8px;position:relative}
.tlstrip a::before{content:"";position:absolute;top:-4px;inset-inline-start:0;width:7px;height:7px;background:var(--blue);border-radius:50%}
.tlstrip b{font-family:var(--f-display);font-size:2rem;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tlstrip span{color:var(--silver);font-size:.92rem}
.tlstrip a:hover b{color:var(--blue)}

/* world panels */
.world{position:relative;min-height:600px;display:flex;align-items:flex-end;isolation:isolate;overflow:hidden}
.world .bg{position:absolute;inset:0;z-index:-2}
.world .bg img{width:100%;height:100%;object-fit:cover}
.world::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(5,8,16,.95) 0%,rgba(5,8,16,.45) 55%,rgba(5,8,16,.2) 100%)}
.world .wrap{padding-block:80px;width:100%}
.world .copy{max-width:640px;display:flex;flex-direction:column;gap:18px}
.world.mars .eyebrow{color:var(--rust)} .world.moon .eyebrow{color:#C7D3E0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 11px;border:1px solid var(--line-2);font-size:.82rem;text-decoration:none;border-radius:2px;background:rgba(5,8,16,.45)}
.chip:hover{border-color:var(--star)}

/* fates */
.fates{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.fates > div{padding:28px 24px 8px 0;border-inline-end:1px solid var(--line);min-width:0}
.fates > div + div{padding-inline-start:24px}
.fates > div:last-child{border:0}
.fates h3{margin:10px 0 16px;display:flex;align-items:center;gap:10px}
.fates ul{list-style:none;padding:0;margin:0}
.fates li a{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:.95rem}
.fates li a span{color:var(--silver);font-family:var(--f-mono);font-size:.7rem;white-space:nowrap}
.fates li a:hover{color:var(--blue)}
@media (max-width:820px){.fates{grid-template-columns:1fr}.fates > div{border:0;padding-inline:0!important}}

.band{background:var(--navy);border-block:1px solid var(--line)}
.closing{text-align:center;padding-block:clamp(90px,14vw,180px)}
.closing blockquote{font-family:var(--f-display);font-size:clamp(1.6rem,3.4vw,2.8rem);font-weight:300;letter-spacing:-.02em;line-height:1.2;max-width:24ch;margin:0 auto 36px;text-wrap:balance}
html[lang=ar] .closing blockquote,html[lang=bn] .closing blockquote{line-height:1.5;letter-spacing:0}

/* explore */
.explore{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:start}
.explore > *{min-width:0}
.filters{position:sticky;top:calc(var(--nav-h) + 20px);display:flex;flex-direction:column;gap:18px}
.filters label{display:flex;flex-direction:column;gap:6px}
.field{background:var(--navy);border:1px solid var(--line);padding:10px 12px;border-radius:2px;width:100%}
.field:focus{border-color:var(--blue);outline:none}
.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.qwrap{position:relative;flex:1;min-width:220px}
.qwrap input{padding-inline-start:38px}
.qwrap svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--silver)}
.filtbtn{display:none}
@media (max-width:900px){.explore{grid-template-columns:1fr}.filters{position:fixed;inset:auto 0 0 0;top:auto;z-index:75;background:var(--navy);border-top:1px solid var(--line-2);padding:20px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut);max-height:80svh;overflow:auto;transform:translateY(105%);transition:transform .35s}.filters.open{transform:none}.filtbtn{display:inline-flex}}
.count{color:var(--silver)}

/* mission page */
.mhero{position:relative;min-height:min(86svh,820px);display:flex;align-items:flex-end;isolation:isolate;overflow:hidden}
.mhero .bg{position:absolute;inset:0;z-index:-2;background:var(--navy)}
.mhero .bg img{width:100%;height:100%;object-fit:cover}
.mhero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--void) 4%,rgba(5,8,16,.5) 50%,rgba(5,8,16,.35) 100%)}
.mhero .wrap{padding-block:calc(var(--nav-h) + 60px) 48px;width:100%}
.mhero h1{font-size:clamp(2.2rem,6vw,5rem);margin:16px 0 18px;max-width:18ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line-2);margin-top:30px}
.facts div{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.facts div + div{padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.facts dt{color:var(--silver)} .facts dd{margin:0;font-family:var(--f-display);font-weight:500;overflow-wrap:anywhere}
.mbody{display:grid;grid-template-columns:200px 1fr;gap:56px;padding-block:64px}
.mbody > *{min-width:0}
.toc{position:sticky;top:calc(var(--nav-h) + 24px);display:flex;flex-direction:column;gap:2px;align-self:start}
.toc a{text-decoration:none;color:var(--silver);font-size:.85rem;padding:5px 0 5px 12px;border-inline-start:1px solid var(--line)}
.toc a:hover{color:var(--star);border-color:var(--blue)}
@media (max-width:900px){.mbody{grid-template-columns:1fr}.toc{display:none}}
.msec{padding-block:30px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:16px;scroll-margin-top:0}
.msec h2{font-size:1.5rem}
.msec p,.msec li{color:#C9D3DF;max-width:68ch}
.msec ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--silver)} .specs dd{margin:0}
.specs .na{color:var(--silver);font-style:italic;font-size:.9rem}
@media (max-width:700px){.specs{grid-template-columns:1fr}.specs div{grid-template-columns:120px 1fr}}
.mtl{list-style:none;padding:0!important;margin:0;position:relative}
.mtl li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);max-width:none!important}
.mtl time{font-family:var(--f-mono);font-size:.78rem;color:var(--blue);padding-top:3px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gallery figure{margin:0}
.gallery img{aspect-ratio:4/3;object-fit:cover;width:100%;cursor:zoom-in;background:var(--navy)}
.gallery figcaption{font-size:.78rem;color:var(--silver);margin-top:6px}
.refs{list-style:none;padding:0!important;margin:0}
.refs a{color:var(--blue);text-decoration:none;overflow-wrap:anywhere} .refs a:hover{text-decoration:underline}
.verified{font-family:var(--f-mono);font-size:.72rem;color:var(--silver)}
.notice{border:1px solid var(--line-2);padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);font-size:.9rem;color:#C9D3DF}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px var(--gut-r) 24px var(--gut);gap:14px}
.lightbox img{max-height:78svh;width:auto;object-fit:contain}
.lightbox .lbcap{max-width:900px;font-size:.88rem;color:#C9D3DF;text-align:center}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:var(--gut-r)}

/* timeline page */
.decades{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:28px;scrollbar-width:thin}
.decades button{background:none;border:0;padding:14px 16px;cursor:pointer;color:var(--silver);font-family:var(--f-display);font-size:1.15rem;font-weight:300;font-variant-numeric:tabular-nums;border-bottom:2px solid transparent;white-space:nowrap}
.decades button[aria-pressed=true]{color:var(--star);border-color:var(--blue)}
.tl{position:relative;padding-inline-start:28px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl .period{margin:36px 0 16px;display:flex;align-items:baseline;gap:16px}
.tl .period h3{font-size:1.5rem}
.tl a{display:grid;grid-template-columns:110px 96px 1fr auto;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;position:relative}
.tl a::before{content:"";position:absolute;inset-inline-start:-26px;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:var(--void);border:1px solid var(--blue)}
.tl a:hover::before{background:var(--blue)}
.tl a time{font-family:var(--f-mono);font-size:.78rem;color:var(--blue)}
.tl a img,.tl a .ph{width:96px;height:64px;object-fit:cover;background:var(--navy)}
.tl a b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.tl a small{display:block;color:var(--silver);font-size:.85rem}
@media (max-width:700px){.tl a{grid-template-columns:1fr auto;gap:6px 12px}.tl a img,.tl a .ph{display:none}.tl a time{grid-column:1/-1}}

/* destinations */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px}
.dcard{position:relative;aspect-ratio:1/1;overflow:hidden;text-decoration:none;display:flex;align-items:flex-end;isolation:isolate;background:var(--navy)}
.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1s}
.dcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(5,8,16,.9),transparent 60%)}
.dcard:hover img{transform:scale(1.05)}
.dcard div{padding:20px}
.dcard h3{font-size:1.5rem;margin-bottom:6px}
.dcard span{color:var(--silver);font-family:var(--f-mono);font-size:.72rem}

/* compare table */
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.9rem}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:400;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--silver);background:var(--navy)}
td a{color:var(--star);font-weight:600}
td{font-variant-numeric:tabular-nums}

/* NOVA */
.nova{display:grid;grid-template-columns:1fr 300px;gap:36px;padding-block:40px 80px}
.nova > *{min-width:0}
@media (max-width:900px){.nova{grid-template-columns:1fr}}
.chat{border:1px solid var(--line);background:linear-gradient(180deg,var(--navy),var(--void));display:flex;flex-direction:column;min-height:560px}
.chatlog{flex:1;padding:24px;display:flex;flex-direction:column;gap:18px;overflow:auto;max-height:66svh}
.msg{max-width:84%;display:flex;flex-direction:column;gap:8px}
.msg.user{align-self:flex-end;background:var(--deep);padding:12px 16px;border-radius:14px 14px 2px 14px}
html[dir=rtl] .msg.user{border-radius:14px 14px 14px 2px}
.msg.bot{align-self:flex-start}
.msg.bot .who{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;color:var(--blue)}
.msg.bot .body{color:#D6DEE8;white-space:pre-wrap}
.msg .srcs{display:flex;flex-wrap:wrap;gap:6px}
.msg .tag{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;padding:3px 7px;border:1px solid var(--line-2);border-radius:2px;color:var(--silver);align-self:flex-start}
.msg .tag.v{border-color:rgba(101,185,138,.5);color:var(--green)} .msg .tag.g{border-color:rgba(217,163,91,.5);color:var(--amber)}
.chatform{display:flex;gap:8px;border-top:1px solid var(--line);padding:14px}
.chatform input{flex:1}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{text-align:start;background:transparent;border:1px solid var(--line);padding:12px 14px;cursor:pointer;border-radius:2px;font-size:.92rem}
.suggest button:hover{border-color:var(--blue)}
.modeline{font-size:.82rem;color:var(--silver);border-inline-start:2px solid var(--blue);padding-inline-start:12px}
.toggle{display:flex;gap:10px;align-items:center;font-size:.88rem;cursor:pointer}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-inline-end:4px;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}

/* credits table */
.creditlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.citem{display:grid;grid-template-columns:96px 1fr;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:.85rem}
.citem img{width:96px;height:72px;object-fit:cover}
.citem .ico{width:96px;height:72px;display:block;background-color:var(--navy);background-repeat:no-repeat}
.ico{background-repeat:no-repeat;flex-shrink:0}
.citem b{display:block;font-family:var(--f-display);font-size:.95rem;margin-bottom:4px}
.citem .mono{color:var(--silver);font-size:.66rem}
.citem a{color:var(--blue);margin-inline-end:10px}

/* footer */
footer{border-top:1px solid var(--line);padding-block:64px calc(40px + env(safe-area-inset-bottom,0px));background:var(--void)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.fgrid > *{min-width:0}
@media (max-width:800px){.fgrid{grid-template-columns:1fr}}
footer .fb{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;font-size:1.1rem}
footer nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
footer nav a,footer .flinks a{color:var(--silver);text-decoration:none;font-size:.9rem}
footer nav a:hover,footer .flinks a:hover{color:var(--star)}
.flinks{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.flinks button{background:none;border:0;padding:0;color:var(--silver);cursor:pointer;font-size:.9rem;text-align:start}
.flinks button:hover{color:var(--star)}
.disc{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--silver);font-size:.82rem}
.disc p{max-width:70ch}

/* INTRO */
.intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro .gate{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:24px var(--gut-r) 24px var(--gut)}
.intro .gate .mark{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.3em;color:var(--silver)}
.intro .gate h2{font-family:var(--f-display);font-weight:300;letter-spacing:.32em;font-size:clamp(1.4rem,3.6vw,2.6rem);text-transform:uppercase;padding-inline-start:.32em}
.intro .gate p{color:var(--silver);font-size:.9rem;max-width:44ch}
.intro .gate::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 60%,rgba(85,153,213,.12),transparent 60%),#000}
.cap{position:absolute;z-index:3;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(90%,980px);text-align:center;pointer-events:none}
.cap span{display:inline;font-family:var(--f-body);font-weight:500;font-size:clamp(1.05rem,2.4vw,1.75rem);line-height:1.5;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 2px #000;background:rgba(0,0,0,.38);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.08em .4em;transition:opacity .25s}
.cap .w{transition:color .2s,opacity .2s;opacity:.55}
.cap .w.on{opacity:1}.cap .w.key.on{color:#F3D9A4}
.cap.hide span{opacity:0}
.reveal{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;opacity:0;transition:opacity 1.3s ease;pointer-events:none;padding:0 var(--gut-r) 0 var(--gut)}
.reveal.on{opacity:1}
.reveal small{font-family:var(--f-display);font-weight:300;letter-spacing:.6em;font-size:clamp(.8rem,1.6vw,1.1rem);padding-inline-start:.6em}
.reveal h2{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:clamp(2rem,7vw,5.6rem);line-height:1;padding-inline-start:.14em;transform:scale(1.04);transition:transform 4s cubic-bezier(.2,.7,.2,1),letter-spacing 4s}
.reveal.on h2{transform:scale(1);letter-spacing:.18em}
.reveal em{font-style:normal;font-family:var(--f-mono);letter-spacing:.3em;font-size:.72rem;color:var(--silver);opacity:0;transition:opacity 1.2s .9s}
.reveal.on em{opacity:1}
.reveal::before{content:"";position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(234,240,247,.10),transparent 65%);z-index:-1}
.ictl{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:var(--gut-r);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ictl .btn{background:rgba(0,0,0,.45);border-color:rgba(234,240,247,.35);color:#fff}
.iprog{position:absolute;z-index:5;left:0;bottom:0;height:2px;background:rgba(234,240,247,.7);width:0}
.ifade{position:absolute;inset:0;background:var(--void);opacity:0;transition:opacity .9s;z-index:6;pointer-events:none}
.ifade.on{opacity:1}

/* museum */
.museum{position:fixed;inset:0;z-index:95;background:#03050a;display:flex}
.museum canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.mu-ui{position:absolute;inset:0;pointer-events:none}
.mu-ui > *{pointer-events:auto}
.mu-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:var(--gut);right:var(--gut-r);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.mu-top > *{pointer-events:auto}
.mu-top .brand{background:rgba(3,5,10,.6);padding:8px 10px}
.mu-top .btn{background:rgba(3,5,10,.6)}
.mu-dir{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:var(--gut);right:var(--gut-r);display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mu-dir button{flex-shrink:0;background:rgba(3,5,10,.72);border:1px solid var(--line-2);padding:10px 14px;cursor:pointer;border-radius:2px;text-align:start;font-size:.85rem}
.mu-dir button:hover,.mu-dir button[aria-pressed=true]{border-color:var(--star)}
.mu-dir small{display:block;color:var(--silver);font-family:var(--f-mono);font-size:.62rem}
.mu-panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);inset-inline-end:var(--gut-r);width:min(360px,calc(100% - 32px));background:rgba(5,8,16,.9);border:1px solid var(--line-2);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 200px);overflow:auto}
.mu-panel p{font-size:.9rem;color:#C9D3DF}
.mu-help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(3,5,10,.72);padding:14px 18px;border:1px solid var(--line);font-size:.88rem;text-align:center;max-width:min(420px,90%);transition:opacity .6s}
.mu-load{position:absolute;inset:0;display:grid;place-items:center;background:#03050a;z-index:2}
.mu-load .bar{width:220px;height:2px;background:var(--line);margin-top:14px;overflow:hidden}
.mu-load .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;border:1px solid rgba(234,240,247,.6);pointer-events:none}
.museum-preview{position:relative;aspect-ratio:16/9;background:#03050a;border:1px solid var(--line);overflow:hidden}
.museum-preview canvas{width:100%;height:100%}
.museum-preview .label{position:absolute;bottom:12px;inset-inline-start:14px}
.page-enter{animation:pin .2s ease-out}
@keyframes pin{from{opacity:0}to{opacity:1}}
/* ── Solar System nav button ── */
.ssbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 9px;border-radius:999px;text-decoration:none;white-space:nowrap;font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.14em;color:var(--star);border:1px solid rgba(255,197,102,.38);background:linear-gradient(135deg,rgba(255,197,102,.08),rgba(85,153,213,.08));transition:border-color .3s,box-shadow .3s,transform .3s}
.ssbtn svg{width:18px;height:18px;flex-shrink:0;color:#B7C6F7}
.ssbtn b{font-weight:500}
.ssbtn:hover,.ssbtn:focus-visible{border-color:rgba(255,197,102,.75);box-shadow:0 0 18px -2px rgba(255,180,90,.35);transform:translateY(-1px)}

/* ── Hardware Locator cinematic intro ── */
.hli{position:fixed;inset:0;z-index:400;background:#000;color:#F2EDE4;overflow:hidden;opacity:1;transition:opacity .65s ease}
.hli.out{opacity:0;pointer-events:none}
.hli-shots,.hli-shot{position:absolute;inset:0;margin:0}
.hli-shot{opacity:0;transition:opacity .7s ease;overflow:hidden}
.hli-shot.on{opacity:1}
.hli-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--fx) var(--fy);transform-origin:var(--fx) var(--fy);transform:scale(1.03)}
.hli-shot.disk{background:#000}
.hli-shot.disk img{opacity:0;transition:opacity .9s ease .45s}.hli-shot.disk.on img{opacity:1}
@media (orientation:portrait){.hli-shot.wide{background:#000}.hli-shot.wide img{object-fit:contain;object-position:50% 50%;transform-origin:50% 50%}}
.hli-shot.disk img{object-fit:contain;object-position:50% 50%;transform-origin:50% 50%;inset:8%;width:84%;height:84%}
.hli-shot.on img{animation:hliPush var(--d) linear forwards}
.hli-shot.disk.on img{animation:hliDisk var(--d) ease-out forwards}
@keyframes hliPush{from{transform:scale(1.03)}to{transform:scale(1.13)}}
@keyframes hliDisk{from{transform:scale(.9)}to{transform:scale(1.08)}}
.hli::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(0deg,rgba(0,0,0,.55) 0,transparent 22%)}
.hli-title{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity 1s ease;background:radial-gradient(ellipse 60% 45% at 50% 55%,rgba(194,80,46,.26),rgba(120,40,20,.08) 55%,transparent 75%),#000}
.hli-title.on{opacity:1}
.hli-h{font-family:var(--font-primary);font-weight:800;font-size:clamp(2rem,7.4vw,5.6rem);letter-spacing:.06em;line-height:1;margin:0;color:#F2EDE4;opacity:0;transform:translateY(8px);transition:opacity 1.2s ease,transform 1.6s ease}
.hli-tag{font-family:var(--font-technical);font-weight:500;font-size:clamp(.72rem,1.4vw,.95rem);letter-spacing:.42em;margin:22px 0 0;color:#E3A48A;opacity:0;transition:opacity 1.1s ease;padding-inline-start:.42em}
.hli-feat{font-family:var(--font-primary);font-weight:600;font-size:clamp(.62rem,1vw,.74rem);letter-spacing:.3em;margin:30px 0 0;color:rgba(242,237,228,.6);opacity:0;transition:opacity 1.1s ease}
.hli-title.m .hli-h{opacity:1;transform:none}.hli-title.g .hli-tag{opacity:1}.hli-title.f .hli-feat{opacity:1}
.hli-cr{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;margin:0;max-width:min(62vw,560px);font-family:var(--font-technical);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(242,237,228,.5);opacity:0;transition:opacity .6s ease}
.hli-cr.on{opacity:1}
.hli-skip{position:absolute;z-index:6;right:max(18px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:8px 6px;background:none;border:0;cursor:pointer;color:rgba(242,237,228,.55);font-family:var(--font-technical);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;transition:color .2s}
.hli-skip kbd{font-family:inherit;color:rgba(242,237,228,.75)}
.hli-skip:hover,.hli-skip:focus-visible{color:#F2EDE4;outline:none}.hli-skip:focus-visible span{text-decoration:underline;text-underline-offset:4px}
.hli-gate{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse 60% 45% at 50% 55%,rgba(194,80,46,.16),transparent 70%),#000;text-align:center;padding:24px}
.hli-gate[hidden]{display:none}
.hli-go{font-family:var(--font-primary);font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:#050810;background:#F2EDE4;border:0;padding:15px 24px;cursor:pointer}
.hli-go:focus-visible{outline:2px solid #C2502E;outline-offset:3px}
.hli-gate small{font-family:var(--font-technical);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,237,228,.55)}
@media (max-width:760px){.hli-cr{max-width:58vw;font-size:.54rem;bottom:calc(20px + env(safe-area-inset-bottom,0px))}.hli-skip{font-size:.6rem;letter-spacing:.14em}.hli-tag{letter-spacing:.28em}.hli-feat{letter-spacing:.2em}.hli-shot.disk img{inset:18% 4%;width:92%;height:64%}}
.hli.rm .hli-shot img,.hli.rm .hli-shot.on img{animation:none!important;transform:none!important}
@media (prefers-reduced-motion:reduce){.hli-shot img,.hli-shot.on img{animation:none!important;transform:none!important}.hli-h{transform:none}}
